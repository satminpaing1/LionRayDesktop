[package]
name = "lionray-desktop"
version = "1.6.0"
description = "LionRay VPN - Desktop"
authors = ["Sett Min Paing"]
license = "MIT"
edition = "2021"

[lib]
name = "lionray_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "blocking", "socks", "stream"] }
base64 = "0.22"
dirs = "5"
urlencoding = "2"
arboard = "3"
sysinfo = "0.33"
zip = "2"
futures-util = "0.3"
tokio = { version = "1", features = ["rt"] }
image = "0.25"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]




