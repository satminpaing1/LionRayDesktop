name: Build Windows (NSIS installer)

# Build-only workflow. Publishing is done by build-release.yml, which waits for
# both Windows and macOS artifacts and creates ONE GitHub Release for them.
#
# Versions come from release-config.json (single source of truth) via the
# orchestrator, or can be overridden for a manual debug build.

on:
  workflow_call:
    inputs:
      app_version:
        description: 'App version to build'
        required: true
        type: string
      xray_version:
        description: 'Xray core tag (e.g. 26.11.9)'
        required: true
        type: string
      singbox_version:
        description: 'sing-box version (e.g. 1.14.4)'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      app_version:
        description: 'App version to build (debug builds do not publish)'
        required: true
        type: string
      xray_version:
        description: 'Optional: override Xray core version (empty = release-config.json)'
        required: false
        type: string
        default: ''
      singbox_version:
        description: 'Optional: override sing-box version (empty = release-config.json)'
        required: false
        type: string
        default: ''

concurrency:
  group: lionray-windows-${{ inputs.app_version || github.ref_name }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust toolchain (Windows x64)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps (retry)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $ok = $false
          for ($i = 1; $i -le 3; $i++) {
            npm ci --no-audit --no-fund
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            Write-Host "npm ci attempt $i failed (exit $LASTEXITCODE); retrying..."
            Start-Sleep -Seconds (10 * $i)
          }
          if (-not $ok) { throw 'npm ci failed after 3 attempts' }

      - name: Resolve versions
        id: ver
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $app = "${{ inputs.app_version }}"
          if ([string]::IsNullOrWhiteSpace($app) -and "${{ github.ref_type }}" -eq 'tag') {
            $app = "${{ github.ref_name }}" -replace '^v', ''
          }
          if ([string]::IsNullOrWhiteSpace($app)) {
            $app = (Get-Content 'release-config.json' -Raw | ConvertFrom-Json).app
          }
          if ([string]::IsNullOrWhiteSpace($app)) { throw 'app version is missing' }
          if ($app -notmatch '^\d+\.\d+\.\d+([.-][0-9A-Za-z.-]+)?$') {
            throw "invalid app version: '$app' (expected semver such as 1.8.58)"
          }

          $cfg = Get-Content 'release-config.json' -Raw | ConvertFrom-Json

          $xray = "${{ inputs.xray_version }}"
          if ([string]::IsNullOrWhiteSpace($xray)) { $xray = $cfg.xray }
          if ($xray -notmatch '^v') { $xray = "v$xray" }

          $singbox = "${{ inputs.singbox_version }}"
          if ([string]::IsNullOrWhiteSpace($singbox)) { $singbox = $cfg.singbox }
          if ($singbox -notmatch '^v') { $singbox = "v$singbox" }

          "app=$app" >> $env:GITHUB_OUTPUT
          "xray=$($xray -replace '^v','')" >> $env:GITHUB_OUTPUT
          "xray_tag=$xray" >> $env:GITHUB_OUTPUT
          "singbox=$($singbox -replace '^v','')" >> $env:GITHUB_OUTPUT
          "singbox_tag=$singbox" >> $env:GITHUB_OUTPUT
          Write-Host "App $app / Xray $xray / sing-box $singbox"

      - name: Set app version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $app = "${{ steps.ver.outputs.app }}"

          $text = Get-Content 'src-tauri/tauri.conf.json' -Raw
          $text = ([regex]'("version"\s*:\s*")[^"]*(")').Replace($text, ('${1}' + $app + '${2}'), 1)
          Set-Content -LiteralPath 'src-tauri/tauri.conf.json' -Value $text -NoNewline

          $cargo = Get-Content 'src-tauri/Cargo.toml' -Raw
          $cargo = ([regex]'(?m)^version\s*=\s*"[^"]*"').Replace($cargo, ('version = "' + $app + '"'), 1)
          Set-Content -LiteralPath 'src-tauri/Cargo.toml' -Value $cargo -NoNewline

          $lib = Get-Content 'src-tauri/src/lib.rs' -Raw
          $lib = ([regex]'pub const APP_VERSION: &str = "[^"]*";').Replace($lib, ('pub const APP_VERSION: &str = "' + $app + '";'))
          Set-Content -LiteralPath 'src-tauri/src/lib.rs' -Value $lib -NoNewline

          npm version $app --no-git-tag-version --allow-same-version --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'npm version failed' }

          Select-String -Path 'src-tauri/tauri.conf.json','package.json' -Pattern '"version"'
          Select-String -Path 'src-tauri/src/lib.rs' -Pattern 'APP_VERSION: &str'

      # ONE installer for every Windows PC: both CPU families are bundled and
      # the app picks the native binary at runtime via GetNativeSystemInfo.
      - name: Stage universal Xray core (Windows x64 + ARM64)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "${{ steps.ver.outputs.xray_tag }}"
          $bundle = 'src-tauri/xray-bundle-win'
          New-Item -ItemType Directory -Force -Path $bundle | Out-Null

          $pairs = @(
            @{ Asset = 'Xray-windows-64.zip';       Out = 'xray.exe' },
            @{ Asset = 'Xray-windows-arm64-v8a.zip'; Out = 'xray-arm64.exe' }
          )
          foreach ($pair in $pairs) {
            $zip = Join-Path $env:RUNNER_TEMP $pair.Asset
            $dir = Join-Path $env:RUNNER_TEMP ($pair.Asset -replace '\.zip$','')
            $url = "https://github.com/XTLS/Xray-core/releases/download/$tag/$($pair.Asset)"
            if (Test-Path $dir) { Remove-Item $dir -Recurse -Force }
            $downloaded = $false
            for ($i = 1; $i -le 5; $i++) {
              & curl.exe -fL --retry 4 --retry-all-errors --retry-delay 3 --connect-timeout 20 -o $zip $url
              if ($LASTEXITCODE -eq 0 -and (Test-Path $zip) -and (Get-Item $zip).Length -gt 5MB) {
                $downloaded = $true; break
              }
              Write-Host "Xray $($pair.Asset) attempt $i failed; retrying..."
              Start-Sleep -Seconds (5 * $i)
            }
            if (-not $downloaded) { throw "could not download $url" }
            Expand-Archive -LiteralPath $zip -DestinationPath $dir -Force
            foreach ($name in @('xray.exe', 'geoip.dat', 'geosite.dat')) {
              $src = Join-Path $dir $name
              if (-not (Test-Path $src)) { throw "$($pair.Asset) is missing $name" }
              $dstName = if ($name -eq 'xray.exe') { $pair.Out } else { $name }
              Copy-Item -LiteralPath $src -Destination (Join-Path $bundle $dstName) -Force
            }
            & (Join-Path $bundle $pair.Out) version
            if ($LASTEXITCODE -ne 0) { throw "staged $($pair.Out) does not run" }
          }
          Set-Content -LiteralPath (Join-Path $bundle 'version.txt') -Value "${{ steps.ver.outputs.xray }}" -NoNewline

      - name: Stage universal sing-box TUN front-end (Windows x64 + ARM64)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "${{ steps.ver.outputs.singbox_tag }}"
          $ver = "${{ steps.ver.outputs.singbox }}"
          $bundle = 'src-tauri/xray-bundle-win'
          $pairs = @(
            @{ Asset = "sing-box-$ver-windows-amd64.zip";  Out = 'sing-box.exe' },
            @{ Asset = "sing-box-$ver-windows-arm64.zip";  Out = 'sing-box-arm64.exe' }
          )
          foreach ($pair in $pairs) {
            $zip = Join-Path $env:RUNNER_TEMP $pair.Asset
            $dir = Join-Path $env:RUNNER_TEMP ($pair.Asset -replace '\.zip$','')
            $url = "https://github.com/SagerNet/sing-box/releases/download/$tag/$($pair.Asset)"
            if (Test-Path $dir) { Remove-Item $dir -Recurse -Force }
            $downloaded = $false
            for ($i = 1; $i -le 5; $i++) {
              & curl.exe -fL --retry 4 --retry-all-errors --retry-delay 3 --connect-timeout 20 -o $zip $url
              if ($LASTEXITCODE -eq 0 -and (Test-Path $zip) -and (Get-Item $zip).Length -gt 5MB) {
                $downloaded = $true; break
              }
              Write-Host "sing-box $($pair.Asset) attempt $i failed; retrying..."
              Start-Sleep -Seconds (5 * $i)
            }
            if (-not $downloaded) { throw "could not download $url" }
            Expand-Archive -LiteralPath $zip -DestinationPath $dir -Force
            $exe = Get-ChildItem -LiteralPath $dir -Recurse -Filter 'sing-box.exe' | Select-Object -First 1
            if (-not $exe) { throw "sing-box.exe not found in $($pair.Asset)" }
            Copy-Item -LiteralPath $exe.FullName -Destination (Join-Path $bundle $pair.Out) -Force
            & (Join-Path $bundle $pair.Out) version
            if ($LASTEXITCODE -ne 0) { throw "staged $($pair.Out) does not run" }
          }
          Set-Content -LiteralPath (Join-Path $bundle 'singbox-version.txt') -Value $ver -NoNewline

      - name: Build Tauri app (Windows NSIS, retry)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $ok = $false
          for ($i = 1; $i -le 3; $i++) {
            Write-Host "Tauri build attempt $i..."
            npm run tauri build
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            Write-Host "Tauri build attempt $i failed; retrying (cargo cache stays warm)..."
            Start-Sleep -Seconds (15 * $i)
          }
          if (-not $ok) { throw 'tauri build failed after 3 attempts' }
        env:
          CI: true

      - name: Verify installer contents
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $bundle = 'src-tauri/xray-bundle-win'
          foreach ($f in @('xray.exe', 'xray-arm64.exe', 'sing-box.exe', 'sing-box-arm64.exe', 'geoip.dat', 'geosite.dat')) {
            $p = Join-Path $bundle $f
            if (-not (Test-Path $p)) { throw "missing bundled core file: $f" }
            if ((Get-Item $p).Length -lt 100000) { throw "bundled core file is too small: $f" }
          }

          $nsi = 'src-tauri/target/release/nsis/x64/installer.nsi'
          if (-not (Test-Path $nsi)) { throw 'installer.nsi was not generated' }
          $text = Get-Content $nsi -Raw
          foreach ($needle in @('xray-bundle-win\xray.exe', 'xray-bundle-win\xray-arm64.exe', 'xray-bundle-win\sing-box.exe', 'xray-bundle-win\sing-box-arm64.exe', 'xray-bundle-win\geoip.dat', 'xray-bundle-win\geosite.dat')) {
            if ($text -notmatch [regex]::Escape($needle)) { throw "installer is missing $needle" }
          }

          $inst = Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe' -ErrorAction SilentlyContinue |
                  Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $inst) { throw 'no NSIS installer was produced' }
          if ($inst.Length -lt 20MB) { throw "installer is suspiciously small: $($inst.Length) bytes" }

          "Installer OK: $($inst.FullName) ($([math]::Round($inst.Length / 1MB, 1)) MB)"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: lionray-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
