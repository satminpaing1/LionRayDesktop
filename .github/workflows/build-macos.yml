name: Build macOS (universal dmg)

# Build-only workflow. Publishing is done by build-release.yml, which waits for
# both Windows and macOS artifacts and creates ONE GitHub Release for them.
#
# The .dmg is genuinely universal: the Tauri app is built for x86_64 + aarch64
# and the two Xray binaries are merged with lipo, so one file runs on Intel and
# Apple Silicon without Rosetta.

on:
  workflow_call:
    inputs:
      app_version:
        description: 'App version to build'
        required: true
        type: string
      xray_version:
        description: 'Xray core version (e.g. 26.11.9)'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      app_version:
        description: 'App version to build (debug builds do not publish)'
        required: true
        type: string
      xray_version:
        description: 'Optional: override Xray core version (empty = release-config.json)'
        required: false
        type: string
        default: ''

concurrency:
  group: lionray-macos-${{ inputs.app_version || github.ref_name }}
  cancel-in-progress: false

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust toolchain (Apple Silicon + Intel)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Install frontend deps
        run: npm install

      - name: Resolve versions
        id: ver
        run: |
          set -e
          APP="${{ inputs.app_version }}"
          if [ -z "$APP" ] && [ "${{ github.ref_type }}" = "tag" ]; then
            APP="${{ github.ref_name }}"
            APP="${APP#v}"
          fi
          if [ -z "$APP" ]; then
            APP=$(jq -r '.app // empty' release-config.json)
          fi
          [ -n "$APP" ] || { echo "app version is missing"; exit 1; }
          echo "app=$APP" >> "$GITHUB_OUTPUT"

          XRAY="${{ inputs.xray_version }}"
          [ -n "$XRAY" ] || XRAY=$(jq -r .xray release-config.json)
          XRAY="${XRAY#v}"
          echo "xray=$XRAY" >> "$GITHUB_OUTPUT"
          echo "xray_tag=v$XRAY" >> "$GITHUB_OUTPUT"
          echo "App $APP / Xray v$XRAY"

      # Keep every version source in sync: dmg filename, About panel, updater.
      - name: Set app version
        run: |
          set -e
          APP="${{ steps.ver.outputs.app }}"
          echo "APP_VERSION=$APP"
          sed -i '' 's/\("version":[[:space:]]*"\)[^"]*\("\)/\1'"$APP"'\2/' src-tauri/tauri.conf.json
          sed -i '' 's/\("version":[[:space:]]*"\)[^"]*\("\)/\1'"$APP"'\2/' package.json
          sed -i '' 's/pub const APP_VERSION: &str = "[^"]*";/pub const APP_VERSION: \&str = "'"$APP"'";/' src-tauri/src/lib.rs
          grep -n '"version"' src-tauri/tauri.conf.json package.json
          grep -n 'APP_VERSION: &str' src-tauri/src/lib.rs

      # XTLS only ships single-arch macOS binaries. Merge both with lipo so the
      # .app truly runs on Intel and Apple Silicon without Rosetta.
      - name: Build universal Xray core (lipo x86_64 + arm64)
        id: xray
        run: |
          set -e
          TAG="${{ steps.ver.outputs.xray_tag }}"
          echo "Xray core tag: $TAG"
          mkdir -p /tmp/xray/{x86,arm}
          curl -fL --retry 5 --retry-delay 5 --retry-all-errors -o /tmp/xray/x86.zip "https://github.com/XTLS/Xray-core/releases/download/${TAG}/Xray-macos-64.zip"
          curl -fL --retry 5 --retry-delay 5 --retry-all-errors -o /tmp/xray/arm.zip "https://github.com/XTLS/Xray-core/releases/download/${TAG}/Xray-macos-arm64-v8a.zip"
          unzip -o -q /tmp/xray/x86.zip -d /tmp/xray/x86
          unzip -o -q /tmp/xray/arm.zip -d /tmp/xray/arm
          lipo -create -output src-tauri/xray-bundle/xray /tmp/xray/x86/xray /tmp/xray/arm/xray
          lipo -info src-tauri/xray-bundle/xray
          # The dat files are also tracked in the repo; only overwrite them when
          # the release archive actually ships matching versions.
          cp /tmp/xray/x86/geoip.dat src-tauri/xray-bundle/geoip.dat 2>/dev/null || true
          cp /tmp/xray/x86/geosite.dat src-tauri/xray-bundle/geosite.dat 2>/dev/null || true
          VER="${TAG#v}"
          echo "${VER}" > src-tauri/xray-bundle/version.txt
          echo "xray_ver=${VER}" >> "$GITHUB_OUTPUT"
          echo "Bundled xray: ${VER}"

      - name: Build universal Tauri app (macOS ARM + Intel)
        run: npm run tauri build -- --target universal-apple-darwin
        env:
          CI: true

      - name: Verify DMG was produced
        run: |
          set -e
          DMG=$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -name '*.dmg' -print -quit)
          [ -n "$DMG" ] || { echo "no dmg produced"; exit 1; }
          echo "dmg=$DMG"
          ls -lh "$DMG"

      - name: Upload dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: lionray-macos
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 30
