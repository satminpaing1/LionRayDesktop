name: Build macOS (dmg / pkg)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust toolchain (Apple Silicon + Intel)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Install frontend deps
        run: npm install

      - name: Build universal Tauri app (macOS ARM + Intel)
        run: npm run tauri build -- --target universal-apple-darwin
        env:
          CI: true

      - name: Upload dmg / pkg artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lionray-macos
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/pkg/*.pkg
          if-no-files-found: warn
