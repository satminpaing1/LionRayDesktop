name: Build macOS (universal dmg)

# One-shot universal macOS build (Apple Silicon + Intel in a single .dmg):
#   * manual run  -> needs app_version, optional Xray pin
#   * tag push    -> app version comes from the tag (v1.6.0)
# The release uses a separate `-macos` tag so it never overwrites the Windows
# release notes or its installer asset.

on:
  workflow_dispatch:
    inputs:
      app_version:
        description: 'App version to build & release (e.g. 1.8.56)'
        required: true
        type: string
      xray_version:
        description: 'Optional: pin Xray core tag (default v26.3.27 - validated)'
        required: false
        type: string
        default: 'v26.3.27'
  push:
    tags:
      - "v*"

jobs:
  macos:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust toolchain (Apple Silicon + Intel)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Install frontend deps
        run: npm install

      # Keep every version source in sync: dmg filename, About panel, updater.
      - name: Set app version
        run: |
          APP_VER="${{ github.event.inputs.app_version || '1.6.0' }}"
          echo "APP_VERSION=$APP_VER"
          sed -i '' 's/\("version":[[:space:]]*"\)[^"]*\("\)/\1'"$APP_VER"'\2/' src-tauri/tauri.conf.json
          sed -i '' 's/\("version":[[:space:]]*"\)[^"]*\("\)/\1'"$APP_VER"'\2/' package.json
          sed -i '' 's/pub const APP_VERSION: &str = "[^"]*";/pub const APP_VERSION: \&str = "'"$APP_VER"'";/' src-tauri/src/lib.rs
          grep -n '"version"' src-tauri/tauri.conf.json package.json
          grep -n 'APP_VERSION: &str' src-tauri/src/lib.rs

      # XTLS only ships single-arch macOS binaries. Merge both with lipo so the
      # .app truly runs on Intel and Apple Silicon without Rosetta.
      - name: Build universal Xray core (lipo x86_64 + arm64)
        id: xray
        run: |
          set -e
          TAG="${{ github.event.inputs.xray_version }}"
          if [ -z "$TAG" ] || [ "$TAG" = "latest" ]; then
            TAG=$(curl -fsSL --retry 5 --retry-delay 5 -o /dev/null -w '%{url_effective}' \
                  "https://github.com/XTLS/Xray-core/releases/latest" \
                  | sed -E 's#.*/tag/([^/]+).*#\1#')
            [ -z "$TAG" ] && TAG="v26.3.27"
          fi
          echo "Xray core tag: $TAG"
          mkdir -p /tmp/xray/{x86,arm}
          curl -fL --retry 5 --retry-delay 5 --retry-all-errors -o /tmp/xray/x86.zip "https://github.com/XTLS/Xray-core/releases/download/${TAG}/Xray-macos-64.zip"
          curl -fL --retry 5 --retry-delay 5 --retry-all-errors -o /tmp/xray/arm.zip "https://github.com/XTLS/Xray-core/releases/download/${TAG}/Xray-macos-arm64-v8a.zip"
          unzip -o -q /tmp/xray/x86.zip -d /tmp/xray/x86
          unzip -o -q /tmp/xray/arm.zip -d /tmp/xray/arm
          lipo -create -output src-tauri/xray-bundle/xray /tmp/xray/x86/xray /tmp/xray/arm/xray
          lipo -info src-tauri/xray-bundle/xray
          VER="${TAG#v}"
          echo "${VER}" > src-tauri/xray-bundle/version.txt
          echo "xray_ver=${VER}" >> "$GITHUB_OUTPUT"
          echo "Bundled xray: ${VER}"

      - name: Build universal Tauri app (macOS ARM + Intel)
        run: npm run tauri build -- --target universal-apple-darwin
        env:
          CI: true

      - name: Verify DMG was produced
        run: |
          set -e
          DMG=$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -name '*.dmg' -print -quit)
          [ -n "$DMG" ] || { echo "no dmg produced"; exit 1; }
          echo "dmg=$DMG"
          ls -lh "$DMG"

      - name: Upload dmg artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lionray-macos-universal
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Create / update macOS GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.app_version || '1.6.0' }}-macos
          name: "LionRay VPN Desktop v${{ github.event.inputs.app_version || '1.6.0' }} (Universal macOS)"
          body: |
            Universal macOS build for **Apple Silicon + Intel** in one .dmg.

            - Xray core: ${{ steps.xray.outputs.xray_ver }} (universal binary via lipo)
            - Same UI as Windows v${{ github.event.inputs.app_version || '1.6.0' }}
            - System proxy is enabled only while connected and turned off on disconnect.

            > Unsigned build — right-click the app and choose **Open** to bypass
            > Gatekeeper, or run:
            > `xattr -dr com.apple.quarantine "/Applications/LionRay VPN.app"`
          files: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          fail_on_unmatched_files: true
          overwrite_files: true
